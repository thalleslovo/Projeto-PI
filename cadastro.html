<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="style/style.css">
    <title>Cadastro de Profissional - ConectaServ</title>
  </head>
  <body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <a class="navbar-brand" href="index.html">
        <img src="imagem/logo.png" alt="ConectaServ Logo">
        <span class="slogan-text">Conectando quem precisa a quem sabe fazer</span>
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="como-funciona.html">Como Funciona</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sobre.html">Sobre Nós</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-light text-dark ml-2 px-3" href="cadastro.html">Cadastrar</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container my-5">
      <div class="bg-white p-4 p-md-5 rounded shadow-sm">
        <h1 class="text-primary">Cadastre-se como Profissional</h1>
        <p class="lead">Preencha o formulário abaixo para criar seu perfil em nossa plataforma.</p>
        
        <form action="#" method="POST" class="mt-4">
            
            <h3 class="text-secondary h4">Informações Básicas</h3>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="titulo">Título Profissional:</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Ex: Jardineiro Profissional" required>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp:</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" required>
                    </div>
                </div>
                <div class="col-md-6">
                     <div class="form-group">
                        <label for="foto_perfil">Foto de Perfil:</label>
                        <input type="file" class="form-control-file" id="foto_perfil" name="foto_perfil">
                    </div>
                </div>
            </div>

            <h3 class="text-secondary h4 mt-4">Detalhes do Serviço</h3>
            <hr>
             <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="cidade">Cidade de Atendimento:</label>
                        <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Ex: Franca (SP)" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="valor">Valor do Serviço:</label>
                        <input type="text" class="form-control" id="valor" name="valor" placeholder="Ex: A partir de R$ 80,00" required>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição Completa do Serviço:</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="5" placeholder="Fale sobre sua experiência, o que você faz, etc..."></textarea>
            </div>

            <button type="submit" class="btn btn-secondary btn-lg mt-3">Criar Perfil</button>
        </form>

      </div>
    </main>

    <footer class="bg-primary text-white text-center p-3 mt-5">
      <p class="mb-0">&copy; 2025 ConectaServ - PI 1º Semestre DSM Fatec Franca</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="script/script.js"></script>
  </body>
</html>
